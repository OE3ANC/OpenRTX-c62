CONFIG_I2C=y
CONFIG_I2C_CSK6=y
CONFIG_ADC=y

CONFIG_UART_CSK6=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

CONFIG_PWM=y
CONFIG_PWM_CSK6=y

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_CSK6_LOCK=y

CONFIG_MAIN_STACK_SIZE=2048
# Leave SRAM for newlib allocations, including modem and codec thread stacks.
CONFIG_HEAP_MEM_POOL_SIZE=32768

# The vendor CSK heap is allocated separately in PSRAM.
CONFIG_CSK_HEAP=y
CONFIG_CSK_HEAP_MEM_POOL_SIZE=307200

CONFIG_CSK6_PSRAM=y

# FROM ESP32S3
CONFIG_POSIX_CLOCK=y
CONFIG_PTHREAD_IPC=y
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_STD_CPP14=y
CONFIG_PRINTK=y
CONFIG_PRINTK_SYNC=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_GPIO=y
CONFIG_CLOCK_CONTROL=y
CONFIG_I2C=y
CONFIG_NEWLIB_LIBC=y

# Enable UART logging backend
CONFIG_LOG_BACKEND_UART=y

# M17 TX confirmed working with 50% drive and inverted polarity.
CONFIG_C62_TX_BASEBAND_LEVEL_PERCENT=50

CONFIG_C62_TX_BASEBAND_INVERT=y

# Compare normal RX polarity now that capture startup timing is fixed.
CONFIG_C62_RX_BASEBAND_INVERT=n

# RX level diagnostic: attenuate before DSP ADC and report captured PCM levels.
CONFIG_C62_M17_RX_GAIN1=1
CONFIG_C62_RX_LEVEL_DIAGNOSTICS=y
